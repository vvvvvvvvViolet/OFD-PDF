name: Build EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/OfdToPdf/OfdToPdf.csproj -c Release -o out

      - name: Verify single-file exe
        shell: pwsh
        run: |
          Get-ChildItem out | Format-Table Name, Length
          if (-not (Test-Path out/OfdToPdf.exe)) { throw "exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: OfdToPdf-windows
          path: out/OfdToPdf.exe

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/OfdToPdf.exe
