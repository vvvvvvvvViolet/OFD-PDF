name: Build EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/OfdToPdf/OfdToPdf.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          # Managed dlls are embedded in the exe (Costura); the optional fonts folder sits next to it.
          New-Item -ItemType Directory -Force dist/OfdToPdf/fonts | Out-Null
          Copy-Item out/OfdToPdf.exe, out/OfdToPdf.exe.config dist/OfdToPdf/
          Set-Content dist/OfdToPdf/fonts/README.txt "Put extra .ttf/.ttc/.otf fonts here (e.g. KaiTi, FangSong) if converted text looks garbled."
          Get-ChildItem -Recurse out | Format-Table FullName, Length
          Get-ChildItem -Recurse dist | Format-Table FullName, Length
          if (-not (Test-Path dist/OfdToPdf/OfdToPdf.exe)) { throw "exe missing" }
          Compress-Archive -Path dist/OfdToPdf -DestinationPath OfdToPdf-windows.zip

      - name: Tests (fonts, watermark, conflicts, corrupt input, page limit)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $exe = (Resolve-Path dist/OfdToPdf/OfdToPdf.exe).Path
          function Run([string[]]$a) {
            $p = Start-Process $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "timed out: $a" }
            return $p.ExitCode
          }
          function Must([bool]$ok, [string]$what) { if (-not $ok) { throw "FAILED: $what" } else { Write-Host "ok: $what" } }

          Get-ChildItem C:/Windows/Fonts | Where-Object Name -match 'simhei|msyh|simsun|simkai|simfang|deng' | Format-Table Name
          python -m pip install --quiet pymupdf
          New-Item -ItemType Directory ci | Out-Null
          Set-Location ci
          python ../tests/make_sample_ofd.py sample.ofd
          python ../tests/make_sample_ofd.py three.ofd --pages 3
          python ../tests/make_sample_ofd.py four.ofd --pages 4
          python ../tests/make_sample_ofd.py big.ofd --pages 12 --signed
          Set-Content bad.ofd "this is not an OFD package"

          # Missing Chinese fonts are substituted, no watermark.
          Must ((Run @('--cli', 'sample.ofd')) -eq 0) "convert sample.ofd"
          python ../tests/check_pdf.py sample.pdf
          if ($LASTEXITCODE -ne 0) { throw "check_pdf failed" }

          # Conflict handling.
          Must ((Run @('--cli', 'sample.ofd')) -eq 0) "second run"
          Must (Test-Path 'sample (1).pdf') "default mode keeps the old PDF and writes 'sample (1).pdf'"
          Must ((Run @('--cli', '--skip-existing', 'sample.ofd')) -eq 0) "--skip-existing run"
          Must (-not (Test-Path 'sample (2).pdf')) "--skip-existing writes nothing"
          Must ((Run @('--cli', '--overwrite', 'sample.ofd')) -eq 0) "--overwrite run"
          Must (-not (Test-Path 'sample (2).pdf')) "--overwrite replaces in place"

          # Corrupt input fails cleanly.
          Must ((Run @('--cli', 'bad.ofd')) -eq 1) "corrupt file exits with 1"
          Must (-not (Test-Path 'bad.pdf')) "corrupt file leaves no PDF"

          # Page limit: Free Spire converts only the first 3 OFD pages. Truncation must be reported.
          function Pages([string]$pdf) { [int](python -c "import pymupdf,sys; print(pymupdf.open(sys.argv[1]).page_count)" $pdf) }
          Must ((Run @('--cli', 'three.ofd')) -eq 0) "3-page OFD converts fully (exit 0)"
          Must ((Pages three.pdf) -eq 3) "3-page OFD gives 3 PDF pages"
          Must ((Run @('--cli', 'four.ofd')) -eq 1) "4-page OFD is reported as partial (exit 1)"
          Write-Host "four.pdf pages: $(Pages four.pdf)"
          Must ((Run @('--cli', 'big.ofd')) -eq 1) "12-page signed OFD is reported as partial (exit 1)"
          Write-Host "big.pdf pages: $(Pages big.pdf)"

          Must (-not (Get-ChildItem -Filter '*.tmp.pdf')) "no temporary files left behind"
          $log = Join-Path $env:LOCALAPPDATA 'OfdToPdf/log.txt'
          Must (Test-Path $log) "conversion log written"
          Get-Content $log -Tail 12

      - name: UI snapshots
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path dist/OfdToPdf/OfdToPdf.exe).Path
          Set-Location ci
          foreach ($case in @(@('empty.png'), @('list.png', 'sample.ofd', 'three.ofd', 'big.ofd', 'bad.ofd'))) {
            $p = Start-Process $exe -ArgumentList (@('--ui-snapshot') + $case) -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "UI timed out: $case" }
            if (-not (Test-Path $case[0])) { throw "no snapshot: $($case[0])" }
            Write-Host "snapshot ok: $($case[0])"
            # Artifacts are not always downloadable; also print the image so it can be read from the log.
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $case[0])))
            Write-Host "BEGIN-PNG $($case[0])"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("PNG:" + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "END-PNG $($case[0])"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OfdToPdf-windows
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: |
            ci/*.png
            ci/*.pdf
          if-no-files-found: ignore

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: OFD to PDF Converter ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: OfdToPdf-windows.zip
