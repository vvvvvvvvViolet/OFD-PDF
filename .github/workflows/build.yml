name: Build EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/OfdToPdf/OfdToPdf.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          # Managed dlls are embedded in the exe (Costura); the optional fonts folder sits next to it.
          New-Item -ItemType Directory -Force dist/OfdToPdf/fonts | Out-Null
          Copy-Item out/OfdToPdf.exe, out/OfdToPdf.exe.config dist/OfdToPdf/
          Set-Content dist/OfdToPdf/fonts/README.txt "Put extra .ttf/.ttc/.otf fonts here (e.g. KaiTi, FangSong) if converted text looks garbled."
          Get-ChildItem -Recurse out | Format-Table FullName, Length
          Get-ChildItem -Recurse dist | Format-Table FullName, Length
          if (-not (Test-Path dist/OfdToPdf/OfdToPdf.exe)) { throw "exe missing" }
          Compress-Archive -Path dist/OfdToPdf -DestinationPath OfdToPdf-windows.zip

      - name: Smoke test (missing Chinese fonts must not render as boxes)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          Get-ChildItem C:/Windows/Fonts | Where-Object Name -match 'simhei|msyh|simsun|simkai|simfang|deng' | Format-Table Name
          python -m pip install --quiet pymupdf
          python tests/make_sample_ofd.py sample.ofd
          $p = Start-Process dist/OfdToPdf/OfdToPdf.exe -ArgumentList 'sample.ofd','--overwrite' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "converter exited with $($p.ExitCode)" }
          python tests/check_pdf.py sample.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: OfdToPdf-windows
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            sample.pdf
            sample.pdf.png
          if-no-files-found: ignore

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: OFD to PDF Converter ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: OfdToPdf-windows.zip
