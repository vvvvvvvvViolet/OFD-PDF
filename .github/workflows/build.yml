name: Build EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/OfdToPdf/OfdToPdf.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          # Managed dlls are embedded in the exe (Costura); native HarfBuzz and the
          # fonts folder must sit next to it.
          New-Item -ItemType Directory -Force dist/OfdToPdf/fonts | Out-Null
          Copy-Item out/OfdToPdf.exe, out/OfdToPdf.exe.config dist/OfdToPdf/
          foreach ($d in 'x64','x86','arm64') { if (Test-Path out/$d) { Copy-Item -Recurse out/$d dist/OfdToPdf/ } }
          Get-ChildItem out -Filter *.dll | Where-Object { $_.Name -like '*HarfBuzz*' } | Copy-Item -Destination dist/OfdToPdf/
          Set-Content dist/OfdToPdf/fonts/README.txt "Put extra .ttf/.ttc/.otf fonts here (e.g. KaiTi, FangSong) if converted text looks garbled."
          Get-ChildItem -Recurse out | Format-Table FullName, Length
          Get-ChildItem -Recurse dist | Format-Table FullName, Length
          if (-not (Test-Path dist/OfdToPdf/OfdToPdf.exe)) { throw "exe missing" }
          Compress-Archive -Path dist/OfdToPdf -DestinationPath OfdToPdf-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OfdToPdf-windows
          path: dist/

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OfdToPdf-windows.zip
